# Hạ tầng dev (1 broker). Production: dùng cluster >= 3 broker, TOPIC_REPLICATION_FACTOR=3, TOPIC_MIN_ISR=2.
x-app: &app
  build: .
  image: ride-pipeline:0.2.4
  init: true
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    DATABASE_URL: postgresql://rides:rides@postgres:5432/rides
    TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
    TOPIC_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR:-1}
    TOPIC_MIN_ISR: ${TOPIC_MIN_ISR:-1}
    CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-500}
    DB_RETRY_DEADLINE_S: ${DB_RETRY_DEADLINE_S:-120}
    PRODUCE_RATE: ${PRODUCE_RATE:-200}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    ports: ["8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
      POSTGRES_DB: rides
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d rides"]
      interval: 5s
      timeout: 5s
      retries: 12

  jr:
    image: jrndio/jr:latest
    profiles: ["jr"]
    entrypoint: ["jr"]
    restart: "no"
    command:
      - run
      - --embedded
      - '{"ride_id":"{{uuid}}","rider_id":"rider-{{integer 1 5000}}","route":"{{randoms "Q1-Q7|Q3-Q10|BT-TD|GV-PN|TB-Q12"}}","fare":{{integer 10 150}}.{{integer 10 99}},"status":"{{randoms "requested|started|completed|cancelled"}}"}'
      - -n
      - "${JR_NUM:-10}"
      - -f
      - "${JR_FREQUENCY:-500ms}"
      - -d
      - "${JR_DURATION:-5m}"

  # Chạy một lần: tạo topic (rides, rides.dlq) và đăng ký schema
  init:
    <<: *app
    entrypoint: ["python", "-m", "ride_pipeline.admin"]
    command: ["setup"]
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
      schema-registry: {condition: service_healthy}

  consumer:
    <<: *app
    entrypoint: ["python", "-m", "ride_pipeline.consumer"]
    restart: unless-stopped
    stop_grace_period: 40s   # SIGTERM -> commit lần cuối -> close(); chừa thời gian flush DLQ
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  # Chạy liên tục: docker compose --profile producer up -d producer
  # Chạy một lần:  docker compose run --rm producer --count 10000
  producer:
    <<: *app
    entrypoint: ["python", "-m", "ride_pipeline.producer"]
    restart: unless-stopped
    stop_grace_period: 40s   # SIGTERM -> flush(30)
    profiles: ["producer"]
    depends_on:
      init: {condition: service_completed_successfully}

volumes:
  pgdata:
