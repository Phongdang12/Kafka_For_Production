<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Luồng dữ liệu của Kafka producer (v0.2.4)"><style>
:root{--bg:#ffffff;--tx:#1b2430;--mu:#5b6675;--py:#e3efff;--pyb:#4a8ad8;--lib:#e2f5ee;--libb:#2e9c76;--br:#fdebe4;--brb:#d9663a;--ar:#44546a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--tx:#e8ecf1;--mu:#9aa6b6;--py:#1d3350;--lib:#173a30;--br:#4a2619;--ar:#9fb0c6}}
text{fill:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px}
.m{fill:var(--mu);font-size:11.5px}.t{font-weight:700}
.bg{fill:var(--bg)}
.py{fill:var(--py);stroke:var(--pyb)}.lib{fill:var(--lib);stroke:var(--libb)}.br{fill:var(--br);stroke:var(--brb)}
.b{stroke-width:1.5}
.ar{stroke:var(--ar);stroke-width:1.6;fill:none}.cm{stroke:var(--brb);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ar)"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--brb)"/></marker>
</defs><rect class="bg" width="900" height="540"/><text x="30" y="24" class="t" >Python (thread của bạn)</text><text x="340" y="24" class="t" >librdkafka (C, thread nền)</text><text x="650" y="24" class="t" >Kafka / dịch vụ ngoài</text><rect class="b py" x="30" y="45" width="260" height="64" rx="8"/><text x="42" y="65" class="t">① Nguồn dữ liệu</text><text x="42" y="83" class="m">--source synthetic | stdin (JR)</text><text x="42" y="99" class="m">dòng JSON sai → log, đếm, bỏ qua</text><rect class="b py" x="30" y="125" width="260" height="64" rx="8"/><text x="42" y="145" class="t">② Validate + serialize Avro</text><text x="42" y="163" class="m">Ride.create(): kiểm tra, fare = decimal</text><text x="42" y="179" class="m">schema đăng ký sẵn (auto.register=off)</text><rect class="b py" x="30" y="205" width="260" height="64" rx="8"/><text x="42" y="225" class="t">③ produce(topic, key, value)</text><text x="42" y="243" class="m">bất đồng bộ: chỉ đưa vào hàng đợi</text><text x="42" y="259" class="m">BufferError → poll() rồi thử lại</text><rect class="b py" x="30" y="285" width="260" height="48" rx="8"/><text x="42" y="305" class="t">④ poll(0) gọi đều đặn</text><text x="42" y="323" class="m">không gọi thì callback không bao giờ chạy</text><rect class="b py" x="30" y="349" width="260" height="64" rx="8"/><text x="42" y="369" class="t">⑤ on_delivery(err, msg)</text><text x="42" y="387" class="m">chạy trong poll()/flush(), thread của bạn</text><text x="42" y="403" class="m">lỗi → log + đếm → mã thoát khác 0</text><rect class="b py" x="30" y="429" width="260" height="64" rx="8"/><text x="42" y="449" class="t">⑥ Tắt máy: flush(30)</text><text x="42" y="467" class="m">SIGTERM/SIGINT → flush rồi mới thoát</text><text x="42" y="483" class="m">error_cb fatal → thoát, để được restart</text><path class="ar" d="M160,109 V125" marker-end="url(#a)"/><path class="ar" d="M160,189 V205" marker-end="url(#a)"/><path class="ar" d="M160,333 V349" marker-end="url(#a)"/><path class="ar" d="M160,413 V429" marker-end="url(#a)"/><path class="ar" d="M160,269 V285" marker-end="url(#a)"/><rect class="b lib" x="340" y="45" width="230" height="64" rx="8"/><text x="352" y="65" class="t">Partitioner</text><text x="352" y="83" class="m">có key: hash(key) → partition</text><text x="352" y="99" class="m">không key: sticky/xoay vòng</text><rect class="b lib" x="340" y="125" width="230" height="64" rx="8"/><text x="352" y="145" class="t">Hàng đợi + gom batch</text><text x="352" y="163" class="m">linger.ms, batch.size</text><text x="352" y="179" class="m">queue.buffering.max.messages / .kbytes</text><rect class="b lib" x="340" y="205" width="230" height="48" rx="8"/><text x="352" y="225" class="t">Nén batch (compress)</text><text x="352" y="243" class="m">compression.type = lz4 / snappy / zstd</text><rect class="b lib" x="340" y="269" width="230" height="80" rx="8"/><text x="352" y="289" class="t">Sender thread (mỗi broker 1)</text><text x="352" y="307" class="m">enable.idempotence=true</text><text x="352" y="323" class="m">retries, delivery.timeout.ms</text><text x="352" y="339" class="m">giữ đúng thứ tự khi retry</text><rect class="b lib" x="340" y="365" width="230" height="48" rx="8"/><text x="352" y="385" class="t">Hàng đợi delivery report</text><text x="352" y="403" class="m">chờ Python gọi poll() để lấy</text><path class="ar" d="M455,109 V125" marker-end="url(#a)"/><path class="ar" d="M455,189 V205" marker-end="url(#a)"/><path class="ar" d="M455,253 V269" marker-end="url(#a)"/><path class="ar" d="M455,349 V365" marker-end="url(#a)"/><path class="ar" d="M290,237 H315 V77 H340" marker-end="url(#a)"/><path class="ar" d="M340,389 H315 V309 H290" marker-end="url(#a)"/><rect class="b br" x="650" y="45" width="230" height="64" rx="8"/><text x="662" y="65" class="t">Schema Registry</text><text x="662" y="83" class="m">xác nhận schema có sẵn lúc khởi động</text><text x="662" y="99" class="m">② dùng schema_id đã cache</text><rect class="b br" x="650" y="269" width="230" height="64" rx="8"/><text x="662" y="289" class="t">Partition leader</text><text x="662" y="307" class="m">ghi batch vào log (append)</text><text x="662" y="323" class="m">trả ack theo cấu hình acks</text><rect class="b br" x="650" y="365" width="230" height="80" rx="8"/><text x="662" y="385" class="t">Follower replicas (ISR)</text><text x="662" y="403" class="m">sao chép từ leader</text><text x="662" y="419" class="m">acks=all chờ nhóm ISR</text><text x="662" y="435" class="m">min.insync.replicas ≥ 2 (prod)</text><path class="ar" d="M570,295 H650" marker-end="url(#a)"/><text x="578" y="289" class="m" >Produce request</text><path class="ar" d="M650,321 H570" marker-end="url(#a)"/><text x="610" y="336" class="m" >ack</text><path class="cm" d="M765,333 V365" marker-end="url(#c)"/><text x="775" y="361" class="m" >replicate</text><text x="650" y="140" class="m" >Dữ liệu lưu dạng đã nén</text><text x="30" y="526" class="m" >Lặp ①→③ cho từng message; ④ gọi định kỳ (sau mỗi lần produce). Nét đứt cam = replicate giữa các broker.</text></svg>