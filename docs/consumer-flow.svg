<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="Luồng dữ liệu của Kafka consumer (v0.2.4)"><style>
:root{--bg:#ffffff;--tx:#1b2430;--mu:#5b6675;--py:#e3efff;--pyb:#4a8ad8;--lib:#e2f5ee;--libb:#2e9c76;--br:#fdebe4;--brb:#d9663a;--ar:#44546a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--tx:#e8ecf1;--mu:#9aa6b6;--py:#1d3350;--lib:#173a30;--br:#4a2619;--ar:#9fb0c6}}
text{fill:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px}
.m{fill:var(--mu);font-size:11.5px}.t{font-weight:700}
.bg{fill:var(--bg)}
.py{fill:var(--py);stroke:var(--pyb)}.lib{fill:var(--lib);stroke:var(--libb)}.br{fill:var(--br);stroke:var(--brb)}
.b{stroke-width:1.5}
.ar{stroke:var(--ar);stroke-width:1.6;fill:none}.cm{stroke:var(--brb);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ar)"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--brb)"/></marker>
</defs><rect class="bg" width="900" height="590"/><text x="30" y="24" class="t" >Python (thread của bạn)</text><text x="340" y="24" class="t" >librdkafka (C, nhiều thread nền)</text><text x="650" y="24" class="t" >Kafka / dịch vụ ngoài</text><rect class="b py" x="30" y="45" width="260" height="48" rx="8"/><text x="42" y="65" class="t">① consume(n) theo batch</text><text x="42" y="83" class="m">trả bytes, tối đa BATCH_SIZE message</text><rect class="b py" x="30" y="107" width="260" height="48" rx="8"/><text x="42" y="127" class="t">② Kiểm tra msg.error()</text><text x="42" y="145" class="m">bỏ qua EOF; lỗi fatal → thoát</text><rect class="b py" x="30" y="169" width="260" height="64" rx="8"/><text x="42" y="189" class="t">③ Deserialize Avro + validate</text><text x="42" y="207" class="m">hỏng vĩnh viễn → DLQ, đi tiếp</text><text x="42" y="223" class="m">Registry lỗi tạm → retry backoff</text><rect class="b py" x="30" y="247" width="260" height="64" rx="8"/><text x="42" y="267" class="t">④ Upsert PostgreSQL</text><text x="42" y="285" class="m">lỗi tạm → retry backoff + jitter</text><text x="42" y="301" class="m">lỗi dữ liệu → tách từng dòng → DLQ</text><rect class="b py" x="30" y="325" width="260" height="64" rx="8"/><text x="42" y="345" class="t">⑤ Gửi DLQ + flush</text><text x="42" y="363" class="m">bytes gốc + header lỗi, vị trí gốc</text><text x="42" y="379" class="m">flush lỗi → không commit, thoát</text><rect class="b py" x="30" y="403" width="260" height="64" rx="8"/><text x="42" y="423" class="t">⑥ Commit offset (đồng bộ)</text><text x="42" y="441" class="m">chỉ offset của batch đã xử lý xong</text><text x="42" y="457" class="m">enable.auto.commit=False</text><rect class="b py" x="30" y="481" width="260" height="48" rx="8"/><text x="42" y="501" class="t">⑦ Metric (bản v0.4)</text><text x="42" y="519" class="m">lag, số lỗi, thời gian xử lý</text><path class="ar" d="M160,93 V107" marker-end="url(#a)"/><path class="ar" d="M160,155 V169" marker-end="url(#a)"/><path class="ar" d="M160,233 V247" marker-end="url(#a)"/><path class="ar" d="M160,311 V325" marker-end="url(#a)"/><path class="ar" d="M160,389 V403" marker-end="url(#a)"/><path class="ar" d="M160,467 V481" marker-end="url(#a)"/><path class="ar" d="M30,435 H14 V69 H30" marker-end="url(#a)"/><rect class="b lib" x="340" y="45" width="230" height="80" rx="8"/><text x="352" y="65" class="t">Fetch thread</text><text x="352" y="83" class="m">fetch.wait.max.ms (chờ tối đa)</text><text x="352" y="99" class="m">fetch.min.bytes (đủ dữ liệu thì trả)</text><text x="352" y="115" class="m">fetch.max.bytes (trần 1 response)</text><rect class="b lib" x="340" y="139" width="230" height="48" rx="8"/><text x="352" y="159" class="t">Giải nén (decompress)</text><text x="352" y="177" class="m">LZ4 / Snappy / zstd</text><rect class="b lib" x="340" y="201" width="230" height="64" rx="8"/><text x="352" y="221" class="t">Hàng đợi nội bộ (bytes)</text><text x="352" y="239" class="m">queued.min.messages</text><text x="352" y="255" class="m">queued.max.messages.kbytes</text><path class="ar" d="M455,125 V139" marker-end="url(#a)"/><path class="ar" d="M455,187 V201" marker-end="url(#a)"/><path class="ar" d="M340,233 H315 V69 H290" marker-end="url(#a)"/><text x="304" y="150" class="m" transform="rotate(-90 304 150)">consume() lấy từ hàng đợi</text><rect class="b lib" x="340" y="395" width="230" height="80" rx="8"/><text x="352" y="415" class="t">Commit &amp; heartbeat</text><text x="352" y="433" class="m">commit offset tường minh tới coordinator</text><text x="352" y="449" class="m">heartbeat nền (session.timeout.ms)</text><text x="352" y="465" class="m">không cần bạn gọi poll để gửi</text><path class="ar" d="M290,435 H340" marker-end="url(#a)"/><rect class="b br" x="650" y="45" width="230" height="80" rx="8"/><text x="662" y="65" class="t">Partition leader</text><text x="662" y="83" class="m">Topic partition A, B (mỗi partition</text><text x="662" y="99" class="m">chỉ 1 consumer trong cùng group)</text><text x="662" y="115" class="m">dữ liệu lưu dạng nén</text><rect class="b br" x="650" y="145" width="230" height="64" rx="8"/><text x="662" y="165" class="t">Schema Registry  (③)</text><text x="662" y="183" class="m">tra schema theo schema_id</text><text x="662" y="199" class="m">(có cache trong consumer)</text><rect class="b br" x="650" y="225" width="230" height="64" rx="8"/><text x="662" y="245" class="t">PostgreSQL  (④)</text><text x="662" y="263" class="m">bảng rides</text><text x="662" y="279" class="m">INSERT ... ON CONFLICT DO UPDATE</text><rect class="b br" x="650" y="305" width="230" height="64" rx="8"/><text x="662" y="325" class="t">Topic rides.dlq  (⑤)</text><text x="662" y="343" class="m">bytes gốc + header lỗi</text><text x="662" y="359" class="m">retention dài hơn topic chính</text><rect class="b br" x="650" y="411" width="230" height="48" rx="8"/><text x="662" y="431" class="t">Group Coordinator</text><text x="662" y="449" class="m">điều phối rebalance, nhận heartbeat</text><rect class="b br" x="650" y="473" width="230" height="48" rx="8"/><text x="662" y="493" class="t">Topic __consumer_offsets</text><text x="662" y="511" class="m">nơi lưu offset đã commit</text><path class="cm" d="M570,435 H650" marker-end="url(#c)"/><path class="cm" d="M765,459 V473" marker-end="url(#c)"/><path class="ar" d="M570,75 H650" marker-end="url(#a)"/><text x="578" y="69" class="m" >Fetch request</text><path class="ar" d="M650,99 H570" marker-end="url(#a)"/><text x="578" y="115" class="m" >response (nén)</text><text x="30" y="576" class="m" >Mũi tên bên trái: quay lại ① cho batch tiếp theo. Nét đứt cam = luồng commit offset.</text></svg>